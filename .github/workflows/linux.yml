name: Linux Build

# Validation build for the Linux artifacts. Runs on demand and on PRs that
# touch the build, so the cross-platform compile and packaging are exercised
# without cutting a release. Artifacts are uploaded to the run for download.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/tables.desktop"
      - "scripts/linux.sh"
      - ".github/workflows/linux.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            curl \
            file \
            desktop-file-utils \
            libasound2-dev \
            libdbus-1-dev \
            libfontconfig-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Test keyboard shortcuts
        run: cargo test -p app --test shortcuts --locked

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build + package
        run: scripts/linux.sh ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tables-linux-${{ matrix.arch }}
          path: dist/linux/*
          if-no-files-found: error
