name: Windows Package

# Validation build for the Windows artifacts (portable .zip + MSI). Runs on
# demand and on PRs that touch the packaging inputs, so the installer build is
# exercised without cutting a release. Artifacts are uploaded to the run for
# download and (crucially, until a Windows machine can smoke-test) inspection.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "scripts/windows.ps1"
      - "packaging/**"
      - ".github/workflows/windows-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Build + package
        shell: pwsh
        run: scripts/windows.ps1 -Arch x86_64

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tables-windows-x86_64
          path: dist/windows/*
          if-no-files-found: error
